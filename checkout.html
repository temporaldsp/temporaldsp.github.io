<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | TemporalDSP</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root { --tdsp-blue: #00A3FF; --tdsp-bg: #0d1117; --tdsp-surface: #161b22; --tdsp-text: #e6edf3; }
        body { background-color: var(--tdsp-bg); color: var(--tdsp-text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #checkout-container { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .logo { text-align: center; font-weight: 800; color: var(--tdsp-blue); letter-spacing: 2px; margin-bottom: 24px; text-transform: uppercase; }
        #checkout { background: var(--tdsp-surface); border-radius: 12px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); min-height: 500px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        #error-message { color: #FF5555; text-align: center; margin-top: 16px; font-weight: 500; display: none; }
    </style>
</head>
<body>
    <div id="checkout-container">
        <div class="logo">TemporalDSP</div>
        <div id="checkout">
            <p style="text-align: center; color: #888; margin-top: 40px;">Opening Secure Vault...</p>
        </div>
        <div id="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sid = new URLSearchParams(window.location.search).get('sid');
            const errorEl = document.getElementById('error-message');
            const checkoutEl = document.getElementById('checkout');

            if (!sid) {
                errorEl.textContent = "Checkout session missing. Please restart in the app.";
                errorEl.style.display = 'block';
                return;
            }

            try {
                // 1. Opaque Handshake (Worker will check Referer)
                const response = await fetch(`https://stripe-licensing-worker.temporaldsp.workers.dev/api/get-session?sid=${sid}`);
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "Security Handshake Expired.");
                }

                const data = await response.json();

                // 2. Initialize Stripe singleton
                const stripe = Stripe('pk_test_51SzdXGK4L3I8HHPPVtJh0ScfyuLL7DthU0U6th0P8VHUtRP3YC9T0zccFSN1C5AzdMh7FIcWb2IRucziSbIj9Ehj00K0I1uS7l');
                const checkout = await stripe.initEmbeddedCheckout({ clientSecret: data.clientSecret });

                // 3. Clear loader and mount
                checkoutEl.innerHTML = ''; 
                checkout.mount('#checkout');

            } catch (err) {
                console.error("[VAULT]", err.message);
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                checkoutEl.innerHTML = '<p style="text-align:center; color:#555;">Handshake failed.</p>';
            }
        });
    </script>
</body>
</html>
