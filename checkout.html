<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TemporalDSP</title>
    <!-- Load Stripe.js directly from Stripe -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        /* Modern minimalist boilerplate matching the TemporalDSP aesthetic */
        :root {
            --tdsp-blue: #00A3FF;
            --tdsp-bg: #0d1117;
            --tdsp-surface: #161b22;
            --tdsp-text: #e6edf3;
        }

        body {
            background-color: var(--tdsp-bg);
            color: var(--tdsp-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #checkout-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
            color: var(--tdsp-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #checkout {
            background: var(--tdsp-surface);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #error-message {
            color: #FF5555;
            text-align: center;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="checkout-container">
        <div class="header">
            <div class="logo">TemporalDSP</div>
        </div>

        <!-- Stripe Embedded Checkout mounts here -->
        <div id="checkout"></div>
        <div id="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Extract the SID from the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const sid = urlParams.get('sid');
            const errorMessageEl = document.getElementById('error-message');

            if (!sid) {
                errorMessageEl.textContent = "Checkout session expired. Please return to the app.";
                errorMessageEl.style.display = 'block';
                return;
            }

            let sessionSecret;
            try {
                // Fetch the actual client secret from the Worker Opaque Vault
                // BASE URL: https://stripe-licensing-worker.fabric-temporaldsp.workers.dev
                const response = await fetch(`https://stripe-licensing-worker.fabric-temporaldsp.workers.dev/api/get-session?sid=${sid}`);

                if (!response.ok) {
                    if (response.status === 410 || response.status === 404) {
                        throw new Error("Checkout session expired. Please return to the app.");
                    }
                    throw new Error("Security handshake failed. Please try again.");
                }

                const data = await response.json();
                sessionSecret = data.clientSecret;

                if (!sessionSecret || (!sessionSecret.startsWith('cs_test_') && !sessionSecret.startsWith('cs_live_'))) {
                    throw new Error("Invalid session data received.");
                }

            } catch (err) {
                console.error("[SECURITY] Handshake Error:", err.message);

                if (err.message.includes("Failed to fetch")) {
                    errorMessageEl.textContent = "Secure Handshake Blocked: Check Browser Consoles for CORS or Network issues.";
                } else {
                    errorMessageEl.textContent = err.message || "Checkout session expired. Please return to the app.";
                }

                errorMessageEl.style.display = 'block';
                return;
            }

            // Initialize Stripe with the provided public key
            const stripe = Stripe('pk_test_51SzdXGK4L3I8HHPPVtJh0ScfyuLL7DthU0U6th0P8VHUtRP3YC9T0zccFSN1C5AzdMh7FIcWb2IRucziSbIj9Ehj00K0I1uS7l');

            try {
                const checkout = await stripe.initEmbeddedCheckout({
                    clientSecret: sessionSecret,
                });

                // Mount Checkout
                checkout.mount('#checkout');
            } catch (mountErr) {
                console.error("Stripe Initialization Error:", mountErr);
                errorMessageEl.textContent = "Failed to load checkout element. Please check your connection.";
                errorMessageEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
