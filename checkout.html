<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | TemporalDSP</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --tdsp-blue: #00A3FF;
            --tdsp-bg: #0d1117;
            --tdsp-surface: #161b22;
            --tdsp-text: #e6edf3;
        }

        body {
            background-color: var(--tdsp-bg);
            color: var(--tdsp-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #checkout-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            font-weight: 800;
            color: var(--tdsp-blue);
            letter-spacing: 2px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        #checkout {
            background: var(--tdsp-surface);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #error-message {
            color: #FF5555;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 85, 85, 0.1);
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="checkout-container">
        <div class="logo">TEMPORALDSP v0.1.1</div>
        <div id="checkout">
            <p style="text-align: center; color: #888; margin-top: 100px;">Initializing secure vault...</p>
        </div>
        <div id="error-message"></div>
    </div>

    <script>
        // Singleton State Management
        let handshakeInitiated = false;
        let isStripeMounted = false;

        async function performHandshake() {
            // Guard: Prevent race conditions
            if (handshakeInitiated || isStripeMounted) return;
            handshakeInitiated = true;

            const sid = new URLSearchParams(window.location.search).get('sid');
            const errorEl = document.getElementById('error-message');
            const checkoutEl = document.getElementById('checkout');

            if (!sid) {
                errorEl.textContent = "Checkout session missing. Please restart in the app.";
                errorEl.style.display = 'block';
                return;
            }

            try {
                console.log("[VAULT] Initiating Invisible Handshake...");

                const response = await fetch(`https://stripe-licensing-worker.temporaldsp.workers.dev/api/get-session?sid=${sid}`);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Session expired.");
                }

                const data = await response.json();

                if (data.clientSecret) {
                    await mountStripe(data.clientSecret);
                } else {
                    throw new Error("Invalid session data received.");
                }

            } catch (err) {
                handshakeInitiated = false;
                console.error("[VAULT] Handshake Error:", err.message);
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                checkoutEl.innerHTML = '<p style="text-align:center; color:#555;">Could not open vault.</p>';
            }
        }

        async function mountStripe(clientSecret) {
            if (isStripeMounted) return;
            isStripeMounted = true;

            console.log("[VAULT] Mounting Stripe Portal...");
            const checkoutEl = document.getElementById('checkout');

            try {
                const stripe = Stripe('pk_test_51SzdXGK4L3I8HHPPVtJh0ScfyuLL7DthU0U6th0P8VHUtRP3YC9T0zccFSN1C5AzdMh7FIcWb2IRucziSbIj9Ehj00K0I1uS7l');
                const checkout = await stripe.initEmbeddedCheckout({ clientSecret });

                // Clear the loading text right before mounting
                checkoutEl.innerHTML = '';
                checkout.mount('#checkout');
            } catch (err) {
                isStripeMounted = false;
                console.error("[VAULT] Stripe Mount Error:", err);
                document.getElementById('error-message').textContent = "Stripe initialization failed.";
                document.getElementById('error-message').style.display = 'block';
            }
        }

        // Execution Trigger
        document.addEventListener("DOMContentLoaded", () => {
            performHandshake();
        });
    </script>
</body>

</html>
