<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TemporalDSP</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root { --tdsp-blue: #00A3FF; --tdsp-bg: #0d1117; --tdsp-surface: #161b22; --tdsp-text: #e6edf3; }
        body { background-color: var(--tdsp-bg); color: var(--tdsp-text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #checkout-container { width: 100%; max-width: 600px; padding: 20px; }
        .logo { text-align: center; font-weight: 800; color: var(--tdsp-blue); letter-spacing: 2px; margin-bottom: 20px; }
        #checkout { background: var(--tdsp-surface); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); min-height: 400px; }
        #error-message { color: #FF5555; text-align: center; margin-top: 16px; display: none; }
    </style>
</head>
<body>
    <div id="checkout-container">
        <div class="logo">TEMPORALDSP</div>
        <div id="checkout">
            <p style="text-align: center; color: #888;">Initializing secure vault...</p>
        </div>
        <div id="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sid = new URLSearchParams(window.location.search).get('sid');
            const errorEl = document.getElementById('error-message');

            if (!sid) {
                errorEl.textContent = "Session missing. Please restart checkout in-app.";
                errorEl.style.display = 'block';
                return;
            }

            try {
                // 1. Fetch Secret from Opaque Vault
                const response = await fetch(`https://stripe-licensing-worker.temporaldsp.workers.dev/api/get-session?sid=${sid}`);
                
                if (!response.ok) throw new Error("Handshake expired. Please return to the app.");

                const { clientSecret } = await response.json();

                // 2. Initialize Stripe
                const stripe = Stripe('pk_test_51SzdXGK4L3I8HHPPVtJh0ScfyuLL7DthU0U6th0P8VHUtRP3YC9T0zccFSN1C5AzdMh7FIcWb2IRucziSbIj9Ehj00K0I1uS7l');
                const checkout = await stripe.initEmbeddedCheckout({ clientSecret });

                // 3. Mount UI
                document.getElementById('checkout').innerHTML = ''; // Clear loader
                checkout.mount('#checkout');

            } catch (err) {
                errorEl.textContent = err.message.includes("fetch") ? "CORS / Network Blocked." : err.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
