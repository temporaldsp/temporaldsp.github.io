<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal DSP</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #333; padding: 40px; text-align: center; background: rgba(20,20,20,0.9); }
        h1 { letter-spacing: 4px; font-weight: normal; margin-bottom: 5px; }
        .sub { color: #666; font-size: 0.9em; letter-spacing: 2px; }
        .status { margin-top: 30px; font-size: 0.8em; color: #00ff9d; }
        .blink { animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="box">
        <h1>TEMPORAL DSP</h1>
        <div class="sub">NEURO-AUDITORY SIGNAL PROCESSING</div>
        <div class="status">SYSTEM STATUS: <span class="blink">ONLINE</span></div>
    </div>
</body>
</html>
