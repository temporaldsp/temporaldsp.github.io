<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TemporalDSP</title>
    <meta name="description" content="TemporalDSP — audio software, made in Ireland.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'deep': '#0a0c10',
                        'panel': '#11161d',
                        'line': '#2a323d',
                        'ink': '#e6edf3',
                        'dim': '#8b95a4',
                        'faint': '#4a5260',
                        'accent': '#3b82f6',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-image:
                radial-gradient(ellipse 90% 60% at 50% -20%, rgba(59, 130, 246, 0.10), transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 110%, rgba(59, 130, 246, 0.06), transparent 60%);
            background-attachment: fixed;
        }

        .grain {
            position: fixed;
            inset: 0;
            opacity: 0.35;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.92); }
        }
        .pulse-soft { animation: pulse-soft 2.8s ease-in-out infinite; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-1 { animation: fade-up 0.8s ease-out 0.1s both; }
        .fade-2 { animation: fade-up 0.8s ease-out 0.3s both; }
        .fade-3 { animation: fade-up 0.8s ease-out 0.5s both; }
        .fade-4 { animation: fade-up 0.8s ease-out 0.7s both; }
        .fade-5 { animation: fade-up 0.8s ease-out 0.9s both; }

        .text-balance { text-wrap: balance; }

        .hairline { background: linear-gradient(to right, transparent, #2a323d 20%, #2a323d 80%, transparent); height: 1px; }

        .mark-line {
            position: absolute;
            background: #2a323d;
        }
    </style>
</head>
<body class="bg-deep text-ink font-sans antialiased selection:bg-accent selection:text-white min-h-screen flex flex-col">

    <div class="grain"></div>

    <div class="relative z-10 flex-1 flex flex-col">

        <!-- Top bar -->
        <header class="max-w-6xl w-full mx-auto px-6 md:px-10 py-7 flex justify-between items-center fade-1">
            <div class="flex items-center gap-2.5">
                <span class="w-1.5 h-1.5 rounded-full bg-accent pulse-soft"></span>
                <span class="text-sm font-medium tracking-tight text-ink">temporaldsp</span>
            </div>
            <a href="mailto:info@temporaldsp.com" class="text-xs font-mono text-dim hover:text-ink transition-colors tracking-wider">
                info@temporaldsp.com
            </a>
        </header>

        <!-- Poster -->
        <main class="flex-1 flex items-center">
            <div class="max-w-6xl w-full mx-auto px-6 md:px-10 py-20 md:py-32">

                <div class="relative">

                    <!-- Corner marks -->
                    <div class="absolute -top-6 -left-6 w-8 h-8 hidden md:block">
                        <div class="absolute top-0 left-0 w-full h-px bg-line"></div>
                        <div class="absolute top-0 left-0 w-px h-full bg-line"></div>
                    </div>
                    <div class="absolute -top-6 -right-6 w-8 h-8 hidden md:block">
                        <div class="absolute top-0 right-0 w-full h-px bg-line"></div>
                        <div class="absolute top-0 right-0 w-px h-full bg-line"></div>
                    </div>
                    <div class="absolute -bottom-6 -left-6 w-8 h-8 hidden md:block">
                        <div class="absolute bottom-0 left-0 w-full h-px bg-line"></div>
                        <div class="absolute bottom-0 left-0 w-px h-full bg-line"></div>
                    </div>
                    <div class="absolute -bottom-6 -right-6 w-8 h-8 hidden md:block">
                        <div class="absolute bottom-0 right-0 w-full h-px bg-line"></div>
                        <div class="absolute bottom-0 right-0 w-px h-full bg-line"></div>
                    </div>

                    <!-- Top meta row -->
                    <div class="flex justify-between items-baseline mb-12 md:mb-20 fade-2">
                        <div class="text-[10px] font-mono text-faint tracking-[0.25em] uppercase">
                            est. 2025
                        </div>
                        <div class="text-[10px] font-mono text-faint tracking-[0.25em] uppercase">
                            Ireland · EU
                        </div>
                    </div>

                    <!-- The statement -->
                    <div class="text-center mb-12 md:mb-20">
                        <h1 class="text-5xl sm:text-6xl md:text-8xl lg:text-9xl font-bold tracking-tight leading-[0.95] text-balance fade-2">
                            <span class="text-ink">Audio software,</span><br>
                            <span class="text-dim">engineered.</span>
                        </h1>
                    </div>

                    <!-- Subtitle -->
                    <div class="max-w-xl mx-auto text-center mb-16 md:mb-24 fade-3">
                        <p class="text-base md:text-lg text-dim leading-relaxed text-balance">
                            For the people who mix.
                        </p>
                    </div>

                    <!-- Hairline -->
                    <div class="hairline mb-16 md:mb-24 fade-4"></div>

                    <!-- Footer triad -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-10 sm:gap-16 max-w-2xl mx-auto fade-5">
                        <div class="text-center sm:text-right">
                            <div class="text-[10px] font-mono text-faint tracking-[0.25em] uppercase mb-3">Discipline</div>
                            <div class="text-sm text-ink">Precision audio engineering</div>
                        </div>
                        <div class="text-center sm:text-left">
                            <div class="text-[10px] font-mono text-faint tracking-[0.25em] uppercase mb-3">Platform</div>
                            <div class="text-sm text-ink">macOS · Apple Silicon</div>
                        </div>
                    </div>

                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="max-w-6xl w-full mx-auto px-6 md:px-10 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 fade-5">
            <div class="text-[10px] font-mono text-faint tracking-wider uppercase">
                © 2025 TemporalDSP · Trading as J.A. Ryan
            </div>
            <div class="flex gap-6 text-[10px] font-mono text-faint tracking-[0.2em] uppercase">
                <a href="/privacy-policy.html" class="hover:text-dim transition-colors">Privacy</a>
                <a href="/terms-of-service.html" class="hover:text-dim transition-colors">Terms</a>
                <a href="/support.html" class="hover:text-dim transition-colors">Support</a>
            </div>
        </footer>

    </div>

</body>
</html>
